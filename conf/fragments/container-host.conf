BB_CONF_FRAGMENT_SUMMARY = "Distro features and multiconfig for microservices-host-image"
BB_CONF_FRAGMENT_DESCRIPTION = "Enables the virtualization and vcontainer distro features and the vruntime-x86-64 multiconfig that container-image-host and BUNDLED_CONTAINERS need. Use together with meta-microservices/systemd."

DISTRO_FEATURES:append = " virtualization vcontainer"
BBMULTICONFIG += "vruntime-x86-64"

# The vruntime multiconfig masks every recipe in these layers
BBFILE_PATTERN_IGNORE_EMPTY_webserver = "1"
BBFILE_PATTERN_IGNORE_EMPTY_meta-python = "1"
BBFILE_PATTERN_IGNORE_EMPTY_filesystems-layer = "1"
